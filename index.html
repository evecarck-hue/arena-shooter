<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">

<title>手槍求生 3D：武器商店大作戰</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#e9ece6;--ink:#1c2422;--sub:#55625d}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121816;--ink:#e6ede9;--sub:#93a39c}}
:root[data-theme="dark"]{--bg:#121816;--ink:#e6ede9;--sub:#93a39c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;display:flex;flex-direction:column;align-items:center;padding:10px}
#wrap{position:relative;width:100%;max-width:960px;aspect-ratio:16/10;background:#141c22;border-radius:10px;overflow:hidden}
#wrap canvas{width:100%;height:100%;display:block}
#hud{position:absolute;inset:0;pointer-events:none;color:#eef4f1;font-weight:700;text-shadow:0 1px 3px #000}
#hp{position:absolute;left:12px;top:12px;width:180px;height:14px;background:#0009;border-radius:3px;overflow:hidden}
#hpf{display:block;height:100%;background:#7dd3c0}
#stam{position:absolute;left:12px;top:30px;width:180px;height:6px;background:#0009;border-radius:3px;overflow:hidden}#stf{display:block;height:100%;background:#f2c14e}
#info{position:absolute;left:12px;top:44px;font-size:14px}
#boss{position:absolute;left:50%;top:12px;width:300px;max-width:40%;height:16px;transform:translateX(-50%);background:#0009;display:none}
#bf{display:block;height:100%;background:#a45ad6}
#cross{position:absolute;left:50%;top:50%;width:20px;height:20px;transform:translate(-50%,-50%)}
#cross:before,#cross:after{content:"";position:absolute;background:#f2c14e;box-shadow:0 0 2px #000}
#cross:before{left:9px;top:0;width:2px;height:20px}#cross:after{top:9px;left:0;height:2px;width:20px}
#slots{position:absolute;left:12px;bottom:12px;display:flex;gap:6px}
#slots div{background:#0009;padding:6px 10px;border-radius:4px;font-size:13px;color:#9fb0a9}
#slots div.on{background:#f2c14e;color:#0d1a17}
#flash{position:absolute;inset:0;background:radial-gradient(transparent 40%,#e02020);opacity:0}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(9,14,13,.86);color:#eef4f1;text-align:center;padding:14px;overflow:auto;gap:8px}
#ov h1,#ov h2{margin:0;letter-spacing:.04em}#ov p{margin:0;max-width:520px;line-height:1.6}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;width:100%;max-width:640px}
.card{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:6px}
.card small{color:#a9bbb3;min-height:2.6em}
button{font:inherit;border:0;border-radius:6px;padding:8px 12px;background:#7dd3c0;color:#0d1a17;font-weight:700;cursor:pointer}
button:disabled{background:#3a4743;color:#8b9a94;cursor:not-allowed}
button:focus-visible{outline:3px solid #f2c14e;outline-offset:2px}
.go{background:#f2c14e;padding:10px 22px;margin-top:4px}.k{color:#a9bbb3;font-size:.9rem}
.dn{position:absolute;transform:translate(-50%,-50%);font-size:18px;color:#fff;animation:dn .8s ease-out forwards;white-space:nowrap}
.dn.k1{color:#ffd23f;font-size:24px}.dn.k2{color:#ff9a3c;font-size:22px}.dn.k3{color:#ff7a2a;font-size:14px}
@keyframes dn{to{transform:translate(-50%,-190%);opacity:0}}
#cross.hit:before,#cross.hit:after{background:#fff}#cross.hs:before,#cross.hs:after{background:#ff3b3b}
#bt{position:absolute;inset:0;text-align:center;font-size:11px;line-height:16px}
#ammo{position:absolute;right:14px;bottom:12px;font-size:26px;text-align:right}#ammo small{font-size:13px;display:block;color:#f2c14e;min-height:1em}
#toast{position:absolute;left:50%;bottom:64px;transform:translateX(-50%);background:#000a;padding:6px 14px;border-radius:4px;font-size:14px;opacity:0;white-space:nowrap}
.sens{display:flex;gap:8px;align-items:center;color:#a9bbb3;font-size:.9rem}.sens input{width:140px}
.adm{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:520px}.adm button{background:#f2c14e}
#bar{width:100%;max-width:960px;display:flex;justify-content:flex-end;align-items:center;gap:8px;padding:0 0 8px;font-size:14px;min-height:34px;box-sizing:border-box}
#bmsg{width:100%;max-width:960px;font-size:13px;color:var(--sub);margin:0 0 8px;box-sizing:border-box}
#ov{justify-content:flex-start;z-index:8}#ov>:first-child{margin-top:auto}#ov>:last-child{margin-bottom:auto}
#slots{z-index:6}
#tc{position:absolute;inset:0;display:none;z-index:5;touch-action:none;user-select:none;-webkit-user-select:none}
#tc button{position:absolute;border-radius:50%;width:64px;height:64px;padding:0;opacity:.78;font-size:14px}
#tfire{right:22px;bottom:26px;width:88px!important;height:88px!important;background:#e4572e!important;font-size:28px!important}
#trl{right:124px;bottom:22px}#tjmp{right:34px;bottom:126px}#tads{right:124px;bottom:92px}#tspr{right:200px;bottom:22px}#tpz{right:12px;top:10px;width:42px!important;height:42px!important;font-size:16px!important}
#jb{position:absolute;width:110px;height:110px;border-radius:50%;background:#ffffff22;border:2px solid #ffffff55;display:none;transform:translate(-50%,-50%)}
#jk{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px;border-radius:50%;background:#ffffff99}
#rot{position:absolute;inset:0;z-index:9;display:none;align-items:center;justify-content:center;background:#0d1210;color:#fff;font-size:18px;text-align:center;padding:20px}
@media (orientation:portrait){body.touch #rot{display:flex}}
body.touch{padding:0}
body.touch #wrap{aspect-ratio:auto;max-width:none;height:calc(100vh - 46px);height:calc(100dvh - 46px);border-radius:0}
body.touch .tip{display:none}
body.touch #slots{left:50%;bottom:auto;top:40px;transform:translateX(-50%);pointer-events:auto}
body.touch #ammo{bottom:auto;top:52px;font-size:20px}
.tip{color:var(--sub);font-size:.85rem;margin:8px 0 0;text-align:center}
</style>
</head>
<body>
<div id="bar"></div><div id="bmsg"></div>
<div id="wrap">
 <div id="hud"><div id="hp"><i id="hpf"></i></div><div id="stam"><i id="stf"></i></div><div id="info"></div><div id="boss"><i id="bf"></i><b id="bt"></b></div><div id="cross"></div><div id="slots"></div><div id="ammo"></div><div id="toast"></div><div id="flash"></div></div>
 <div id="tc"><div id="jb"><i id="jk"></i></div><button id="tfire" data-a="fire">🔥</button><button id="trl" data-a="rl">換彈</button><button id="tjmp" data-a="jmp">跳</button><button id="tads" data-a="ads">瞄</button><button id="tspr" data-a="spr">衝</button><button id="tpz" data-a="pz">⏸</button></div><div id="rot">請將手機橫放來玩 📱</div>

<script>
const touch=matchMedia('(pointer:coarse)').matches||location.search.includes('touch');if(touch)document.body.classList.add('touch');
let JX=0,JY=0,tcShow=false;const H={};const J={id:null,ox:0,oy:0},L={id:null,x:0,y:0},F={id:null};
const $=id=>document.getElementById(id),wrap=$('wrap'),ov=$('ov');
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const WEAP={pistol:{n:'手槍',cost:0,cd:.35,auto:0,mag:12,rt:1.1,res:1e9},rifle:{n:'步槍',cost:120,cd:.09,auto:1,mag:30,rt:1.8,res:120},rpg:{n:'RPG',cost:300,cd:.1,auto:0,mag:1,rt:2,res:5},molo:{n:'火焰瓶',cost:180,cd:.1,auto:0,mag:1,rt:1.5,res:6}};
const ORDER=['pistol','rifle','rpg','molo'];
// ---------- scene ----------
const R=new THREE.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(devicePixelRatio||1,touch?1.5:2));wrap.prepend(R.domElement);
const sc=new THREE.Scene();sc.background=new THREE.Color(0x141c22);sc.fog=new THREE.Fog(0x141c22,12,55);
const cam=new THREE.PerspectiveCamera(75,1.6,.1,100);cam.rotation.order='YXZ';sc.add(cam);
function fit(){const w=wrap.clientWidth,h=wrap.clientHeight;R.setSize(w,h);cam.aspect=w/h;cam.updateProjectionMatrix()}
addEventListener('resize',fit);fit();
sc.add(new THREE.HemisphereLight(0xbfd4ff,0x2a2f26,.9));const dl=new THREE.DirectionalLight(0xffffff,.6);dl.position.set(10,20,5);sc.add(dl);
const fc=document.createElement('canvas');fc.width=fc.height=128;{const c=fc.getContext('2d');c.fillStyle='#3b444b';c.fillRect(0,0,128,128);for(let i=0;i<400;i++){c.fillStyle=Math.random()<.5?'rgba(255,255,255,.06)':'rgba(0,0,0,.08)';c.beginPath();c.arc(Math.random()*128,Math.random()*128,1+Math.random()*3,0,6.3);c.fill()}}
const ft=new THREE.CanvasTexture(fc);ft.wrapS=ft.wrapT=THREE.RepeatWrapping;ft.repeat.set(12,12);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(62,62),new THREE.MeshLambertMaterial({map:ft}));floor.rotation.x=-Math.PI/2;sc.add(floor);

const bc=document.createElement('canvas');bc.width=bc.height=64;{const c=bc.getContext('2d');c.fillStyle='#8b5e4a';c.fillRect(0,0,64,64);c.strokeStyle='#4a2f25';c.lineWidth=3;for(let y=0;y<=64;y+=16){c.beginPath();c.moveTo(0,y);c.lineTo(64,y);c.stroke();for(let x=(y/16%2)*16;x<64;x+=32){c.beginPath();c.moveTo(x,y);c.lineTo(x,y+16);c.stroke()}}}
const brick=new THREE.CanvasTexture(bc);brick.wrapS=brick.wrapT=THREE.RepeatWrapping;
const walls=[],cols=[];
function wall(x,z,w,d){const t=brick.clone();t.needsUpdate=true;t.repeat.set(Math.max(w,d)/2,2);const m=new THREE.Mesh(new THREE.BoxGeometry(w,4,d),new THREE.MeshLambertMaterial({map:t}));m.position.set(x,2,z);sc.add(m);m.updateMatrixWorld();walls.push(m);cols.push({a:x-w/2,b:x+w/2,c:z-d/2,d:z+d/2})}
[[0,-30.5,62,1],[0,30.5,62,1],[-30.5,0,1,62],[30.5,0,1,62],[-12,-10,10,1.2],[12,-10,10,1.2],[-12,10,10,1.2],[12,10,10,1.2],[0,0,1.5,10],[-20,0,1.2,8],[20,0,1.2,8],[0,-20,8,1.2],[0,21,8,1.2]].forEach(a=>wall(...a));
function resolve(o,r){for(const c of cols){const nx=clamp(o.x,c.a,c.b),nz=clamp(o.z,c.c,c.d),dx=o.x-nx,dz=o.z-nz,d2=dx*dx+dz*dz;if(d2<r*r&&d2>1e-6){const d=Math.sqrt(d2),k=(r-d)/d;o.x+=dx*k;o.z+=dz*k}}}
function inWall(x,z,r){return cols.some(c=>x>c.a-r&&x<c.b+r&&z>c.c-r&&z<c.d+r)}
// ---------- viewmodels ----------
const guns={};
function vm(k){const g=new THREE.Group(),mt=c=>new THREE.MeshLambertMaterial({color:c});
 const cy=(r,l,c,x,y,z,rx,r2)=>{const m=new THREE.Mesh(new THREE.CylinderGeometry(r2==null?r:r2,r,l,14),mt(c));m.rotation.x=rx==null?Math.PI/2:rx;m.position.set(x,y,z);g.add(m)};
 if(k=='pistol'){cy(.035,.3,0x3b4248,0,0,0);cy(.028,.14,0x22272b,0,-.08,.09,.25)}
 if(k=='rifle'){cy(.022,.5,0x111417,0,.01,-.45);cy(.042,.55,0x2c3238,0,0,0);cy(.03,.16,0x1c2024,0,-.1,.05,.15);cy(.04,.3,0x6b4a2f,0,-.02,.42)}
 if(k=='rpg'){cy(.07,1,0x4c5a3a,0,0,-.1);cy(.11,.22,0x8a3a1f,0,0,-.68,null,.05);cy(.028,.15,0x22272b,0,-.11,.1,.25)}
 if(k=='molo'){cy(.05,.18,0x3f8f5a,0,0,0,0);cy(.022,.1,0x3f8f5a,0,.14,0,0);cy(.018,.06,0xd8c89a,0,.22,0,0);cy(.03,.1,0xff8a2a,0,.29,0,0,0)}
 g.position.set(.3,-.28,-.55);g.visible=false;cam.add(g);guns[k]=g}
ORDER.forEach(vm);
// ---------- characters ----------
function makeChar(boss){
 const g=new THREE.Group(),mats=[],mt=c=>{const m=new THREE.MeshLambertMaterial({color:c});mats.push(m);return m};
 const pick=a=>a[Math.random()*a.length|0];
 const skin=mt(boss?0x7a3fa0:pick([0x7fae55,0xa8b06a,0x6fa6a0])),cloth=mt(boss?0x2b1b3d:pick([0x4a5f86,0x8a4a4a,0x5b6b3a])),dark=mt(boss?0x1a1024:0x2f3a52);
 const sph=(r,m,x,y,z)=>{const q=new THREE.Mesh(new THREE.SphereGeometry(r,16,12),m);q.position.set(x,y,z);g.add(q);return q};
 const cap=(r,h,m)=>{const q=new THREE.Group();q.add(new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,12),m));for(const t of[-1,1]){const e=new THREE.Mesh(new THREE.SphereGeometry(r,12,8),m);e.position.y=t*h/2;q.add(e)}return q};
 const torso=cap(.28,.35,cloth);torso.position.y=1.2;torso.scale.set(1.15,1,.8);g.add(torso);
 sph(.27,skin,0,1.85,0);
 const eye=new THREE.MeshBasicMaterial({color:0xff3030});sph(.05,eye,-.1,1.9,.235);sph(.05,eye,.1,1.9,.235);
 const limb=(r,h,m,x,y)=>{const p=new THREE.Group(),c=cap(r,h,m);c.position.y=-(h/2+r);p.add(c);p.position.set(x,y,0);g.add(p);return p};
 const aL=limb(.085,.4,skin,-.4,1.5),aR=limb(.085,.4,skin,.4,1.5),lL=limb(.12,.5,dark,-.16,.78),lR=limb(.12,.5,dark,.16,.78);
 if(boss){for(const t of[-1,1]){const h=new THREE.Mesh(new THREE.ConeGeometry(.08,.4,10),new THREE.MeshLambertMaterial({color:0xe8dcc0}));h.position.set(t*.17,2.12,0);h.rotation.z=-t*.4;g.add(h);sph(.17,dark,t*.42,1.55,0)}}
 else if(Math.random()<.5){const c=new THREE.Mesh(new THREE.SphereGeometry(.29,16,8,0,6.283,0,1.3),dark);c.position.y=1.87;g.add(c)}
 g.scale.setScalar(boss?2.2:1);return{g,mats,aL,aR,lL,lR}}
// ---------- state ----------
let S,P={x:0,z:14},lock=false,fallback=false,sens=1;try{sens=+localStorage.getItem("sens")||1}catch(e){}const K={},M={down:0,fired:0};
const D=new THREE.Vector3(),RC=new THREE.Raycaster();
function newState(){return{mode:'menu',wave:0,gold:0,owned:{pistol:1},cur:'pistol',hp:100,max:100,cd:0,yaw:0,pitch:0,en:[],pr:[],eb:[],fx:[],fire:[],toSpawn:0,spT:0,boss:false,t:0,kick:0,shake:0,fl:0,ammo:{pistol:12,rifle:0,rpg:0,molo:0},res:{pistol:1e9,rifle:0,rpg:0,molo:0},rl:0,tt:0,tx:'',z:0,vy:0,py:0,st:100,sd:0,sp:0}}
S=newState();
function clearAll(){S.en.forEach(e=>sc.remove(e.bar));for(const a of[S.en.map(e=>e.g),S.pr.map(q=>q.m),S.eb.map(q=>q.m),S.fx.map(f=>f.m),S.fire.map(f=>f.m)])a.forEach(m=>sc.remove(m));S.en=[];S.pr=[];S.eb=[];S.fx=[];S.fire=[]}
function reqLock(){if(touch)return;try{const r=R.domElement.requestPointerLock();if(r&&r.catch)r.catch(()=>fallback=true)}catch(e){fallback=true}}
function sensUI(){return `<label class="sens">滑鼠靈敏度 <input type="range" min=".3" max="3" step=".1" value="${sens}" oninput="setSens(this.value)"> <b id="sv">${(+sens).toFixed(1)}</b></label><button onclick="tmute(this)">音效：${mute?'關':'開'}</button>`}
function setSens(v){sens=clamp(+v,.3,3);const e=$('sv');if(e)e.textContent=sens.toFixed(1);try{localStorage.setItem('sens',sens)}catch(x){}}
function pauseUI(){S.mode='pause';M.down=0;M.ads=0;ov.innerHTML='<h2>已暫停</h2>'+sensUI()+admUI()+(touch?'':'<p class="k">按 E 鎖定滑鼠並繼續</p>')+'<button class="go" onclick="resume()">繼續遊戲</button>';ov.style.display='flex'}
document.addEventListener('pointerlockchange',()=>{lock=document.pointerLockElement===R.domElement;if(lock)fallback=false;else if(S.mode=='play'&&!fallback)pauseUI()});
document.addEventListener('pointerlockerror',()=>fallback=true);
function resume(){S.mode='play';ov.style.display='none';reqLock()}
function toast(t){S.tx=t;S.tt=1.4}
addEventListener('keydown',e=>{K[e.code]=1;const i=['Digit1','Digit2','Digit3','Digit4'].indexOf(e.code);
 if(i>=0&&S.mode=='play'&&S.owned[ORDER[i]]){S.cur=ORDER[i];S.rl=0}
 if(!e.repeat){
  if(e.code=='KeyE'){if(S.mode=='pause')resume();else if(S.mode=='play'){if(lock)document.exitPointerLock();else reqLock()}}
  if(e.code=='KeyR'&&S.mode=='play')reload();
  if(e.code=='Space')jump();
  if(e.code=='KeyM'){mute=!mute;toast('音效 '+(mute?'關':'開'))}
  if(e.code=='BracketLeft'||e.code=='BracketRight'){setSens(sens+(e.code=='BracketRight'?.1:-.1));toast('靈敏度 '+sens.toFixed(1))}}
 if(e.code.startsWith('Arrow')||e.code=='Space')e.preventDefault()});
addEventListener('keyup',e=>K[e.code]=0);
document.addEventListener('mousemove',e=>{if(S.mode=='play'&&lock){S.yaw-=e.movementX*.0022*sens*(1-.45*S.z);S.pitch=clamp(S.pitch-e.movementY*.0022*sens*(1-.45*S.z),-1.3,1.3)}});
wrap.addEventListener('mousedown',e=>{au();if(S.mode=='play'){if(e.button==2)M.ads=1;else{M.down=1;M.fired=0}}});
wrap.addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('mouseup',e=>{if(e.button==2)M.ads=0;else M.down=0});
// ---------- menus ----------
const CLIENT_ID='1013195266703-re3mcdokrh6kjp5hhp7bm52b8m15a0pe.apps.googleusercontent.com',ADMIN='evecarck@gmail.com';
let user=null,god=false,gReady=false;

function onCred(r){try{const b=r.credential.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'),p=JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(b),c=>c.charCodeAt(0))));

 if(gReady){b.innerHTML='<span id="gbtn"></span>';try{google.accounts.id.renderButton($('gbtn'),{theme:'filled_black',size:'medium',text:'signin_with',locale:'zh-TW'})}catch(e){}}
 else b.innerHTML='<button onclick="noG()">🔑 Google 登入</button>'}

  if(a=='fire'||a=='spr'){H[t.identifier]=a;if(a=='fire'){M.down=1;M.fired=0}else M.sprint=1}else if(a=='jmp')jump();else if(a=='ads')M.ads=M.ads?0:1;
  else if(a=='rl')reload();
  else if(a=='pz')pauseUI();
  else if(t.clientX-r.left<r.width*.45){if(J.id==null){J.id=t.identifier;J.ox=t.clientX-r.left;J.oy=t.clientY-r.top;jb.style.left=J.ox+'px';jb.style.top=J.oy+'px';jb.style.display='block';jk.style.transform='none'}}
  else if(L.id==null){L.id=t.identifier;L.x=t.clientX;L.y=t.clientY}}},{passive:false});
 tc.addEventListener('touchmove',e=>{e.preventDefault();const r=tc.getBoundingClientRect();for(const t of e.changedTouches){
  if(t.identifier===J.id){let dx=t.clientX-r.left-J.ox,dy=t.clientY-r.top-J.oy;const m=Math.hypot(dx,dy),R0=45;if(m>R0){dx*=R0/m;dy*=R0/m}JX=dx/R0;JY=dy/R0;jk.style.transform=`translate(${dx}px,${dy}px)`}
  else if(t.identifier===L.id){S.yaw-=(t.clientX-L.x)*.005*sens*(1-.45*S.z);S.pitch=clamp(S.pitch-(t.clientY-L.y)*.005*sens*(1-.45*S.z),-1.3,1.3);L.x=t.clientX;L.y=t.clientY}}},{passive:false});
 const end=e=>{e.preventDefault();for(const t of e.changedTouches){if(t.identifier===J.id){J.id=null;JX=JY=0;jb.style.display='none'}if(t.identifier===L.id)L.id=null;{const h=H[t.identifier];if(h=='fire')M.down=0;if(h=='spr')M.sprint=0;delete H[t.identifier]}}};
 tc.addEventListener('touchend',end,{passive:false});tc.addEventListener('touchcancel',end,{passive:false})}
barUI();menu();requestAnimationFrame(loop);
